[project]
name = "cosmos-cds"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.10.1",
    "decord==0.6.0",
    "flask==3.1.3",
    "huggingface-hub==0.36.0",
    "numpy==2.2.6",
    "physical-ai-av==0.2.2",
    "pyarrow==21.0.0",
    "pymilvus==3.0.0",
    "rich==14.2.0",
    "torch==2.8.0",
    "tqdm==4.67.1",
    "transformers==4.56.2",
]

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
cosmos_cds = ["web_viewer/*"]
